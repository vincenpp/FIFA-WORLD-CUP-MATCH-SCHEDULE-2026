function searchMatches(){

    const selectedDate =
        document.getElementById("datePicker").value;

    const results =
        document.getElementById("results");

    results.innerHTML="";

    const filtered =
        matches.filter(
            match => match.date === selectedDate
        );

    if(filtered.length===0){

        results.innerHTML=
        '<div class="no-match">No matches found for this date.</div>';

        return;
    }

    filtered.forEach(match=>{

        results.innerHTML += `

        <div class="match-card">

            <div class="teams">

                <div class="team">
                    <img src="${match.team1_flag}">
                    <div class="team-name">
                        ${match.team1}
                    </div>
                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team">
                    <img src="${match.team2_flag}">
                    <div class="team-name">
                        ${match.team2}
                    </div>
                </div>

            </div>

            <div class="match-time">
                🕒 ${match.time_ist} IST
            </div>

            <div class="venue-box">
                🏟 ${match.stadium}<br>
                📍 ${match.city}
            </div>

            <div class="stage-badge">
                🏆 ${match.stage}
            </div>

        </div>

        `;

    });

}

</script>
